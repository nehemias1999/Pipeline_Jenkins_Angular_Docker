version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}"
    container_name: "${DOCKER_CONTAINER_NAME}" 
    env_file:
      - dockerfile.env
    ports:
      - "${REMOTE_SERVER_IP}:${NGINX_PORT}:80"
    environment:
      - NGINX_HOST=${NGINX_HOST}
      - NGINX_PORT=${NGINX_PORT}
    restart: always 
